<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>校园红黑榜 - 撰写校内真实点评</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script>
        const SUPABASE_URL = "https://xxnavrsgjevkcglhecwa.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_y_ECB7HzTdezrPhxDaS5Zw_cKSgAFbF";
        window.supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    </script>
    <script src="./guard.js"></script>
    <style>
        :root {
            --primary: #4A90E2;
            --primary-dark: #357ABD;
            --accent: #FF9F43;
            --bg-light: #F5F7FA;
            --text-main: #2D3748;
            --text-sub: #8A919F;
            --white: #FFFFFF;
            --red-soft: #F56565;
            --green-soft: #48BB78;
            --border-light: #E2E8F0;
        }
        
        .primary-btn { 
            background: var(--primary); 
            transition: all 0.2s ease;
        }
        .primary-btn:hover { 
            background: var(--primary-dark); 
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(74, 144, 226, 0.3);
        }
        
        .form-card {
            background: var(--white);
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.08);
        }
        
        .input-field {
            border: 1px solid var(--border-light);
            border-radius: 12px;
            transition: all 0.2s ease;
            background: var(--white);
        }
        .input-field:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(74, 144, 226, 0.1);
        }
        .input-field:hover {
            border-color: var(--primary);
        }
        
        .type-btn { 
            transition: all 0.2s ease;
            border-radius: 12px;
            border: 2px solid var(--border-light);
            background: var(--white);
            color: var(--text-sub);
        }
        .type-btn.selected-red { 
            background: #FFF5F5; 
            color: #E53E3E; 
            border-color: #E53E3E;
        }
        .type-btn.selected-black { 
            background: #F7FAFC; 
            color: #2D3748; 
            border-color: #2D3748;
        }
        .type-btn:not(.selected-red):not(.selected-black):hover {
            border-color: var(--primary);
            color: var(--primary);
        }
        .type-dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            display: inline-block;
        }
        .type-dot.red {
            background: #E53E3E;
        }
        .type-dot.black {
            background: #2D3748;
        }
        
        .star-filled { color: var(--accent); }
        .star-empty { color: #E2E8F0; }
        
        .anonymous-check {
            accent-color: var(--primary);
        }
        
        .required { color: var(--red-soft); }
    </style>
<base target="_blank">
</head>
<body class="min-h-screen flex items-center justify-center p-4" style="background: var(--bg-light);">
    <div class="w-full max-w-xl form-card p-8">
        <div class="flex justify-between items-center mb-6 pb-4 border-b" style="border-color: var(--border-light);">
            <h2 class="text-xl font-semibold flex items-center gap-2" style="color: var(--text-main);">
                <span>📝</span>
                <span>发布校内商铺红黑帖</span>
            </h2>
            <a href="index.html" class="px-3 py-1.5 rounded-lg text-sm font-medium transition hover:bg-gray-100" style="color: var(--text-sub);">
                取消返回
            </a>
        </div>

        <form onsubmit="handlePostSubmit(event)" class="space-y-6">
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-lg font-bold mb-2" style="color: var(--text-main);">
                        标准化店铺名称 <span class="required">*</span>
                    </label>
                    <input type="text" id="post-shop" required placeholder="例如：麦当劳（荔园店）" 
                        class="w-full px-4 py-3 input-field text-sm outline-none" style="color: var(--text-main);">
                </div>
                <div>
                    <label class="block text-lg font-bold mb-2" style="color: var(--text-main);">
                        红黑榜属性 <span class="required">*</span>
                    </label>
                    <input type="hidden" id="post-type" value="RED">
                    <div class="grid grid-cols-2 gap-3">
                        <button type="button" onclick="selectType('RED')" id="btn-red" class="type-btn selected-red flex items-center justify-center gap-2 px-4 py-3 text-sm font-bold">
                            <span class="type-dot red"></span><span>红榜</span>
                        </button>
                        <button type="button" onclick="selectType('BLACK')" id="btn-black" class="type-btn flex items-center justify-center gap-2 px-4 py-3 text-sm font-bold">
                            <span class="type-dot black"></span><span>黑榜</span>
                        </button>
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-lg font-bold mb-2" style="color: var(--text-main);">
                        评分星级 <span class="required">*</span>
                    </label>
                    <input type="hidden" id="post-rating" value="5">
                    <div class="flex items-center space-x-1" id="star-container" onmouseleave="resetStarHover()">
                        <button type="button" onclick="setRating(1)" onmouseenter="hoverStar(1)" class="text-2xl focus:outline-none transition-colors">★</button>
                        <button type="button" onclick="setRating(2)" onmouseenter="hoverStar(2)" class="text-2xl focus:outline-none transition-colors">★</button>
                        <button type="button" onclick="setRating(3)" onmouseenter="hoverStar(3)" class="text-2xl focus:outline-none transition-colors">★</button>
                        <button type="button" onclick="setRating(4)" onmouseenter="hoverStar(4)" class="text-2xl focus:outline-none transition-colors">★</button>
                        <button type="button" onclick="setRating(5)" onmouseenter="hoverStar(5)" class="text-2xl focus:outline-none transition-colors">★</button>
                        <span id="rating-text" class="ml-3 text-sm font-medium" style="color: var(--text-sub);">5星 极力安利</span>
                    </div>
                </div>
                <div>
                    <label class="block text-lg font-bold mb-2" style="color: var(--text-main);">分类标签</label>
                    <input type="text" id="post-tags" placeholder="美食、性价比、服务差" 
                        class="w-full px-4 py-3 input-field text-sm outline-none" style="color: var(--text-main);">
                    <p class="text-xs mt-1" style="color: var(--text-sub);">请用中文顿号隔开</p>
                </div>
            </div>

            <div>
                <label class="block text-lg font-bold mb-2" style="color: var(--text-main);">
                    帖子标题 <span class="required">*</span>
                </label>
                <input type="text" id="post-title" required placeholder="一句话概括你的核心体验..." 
                    class="w-full px-4 py-3 input-field text-sm outline-none" style="color: var(--text-main);">
            </div>

            <div>
                <label class="block text-lg font-bold mb-2" style="color: var(--text-main);">
                    详细经历描述 <span class="required">*</span>
                </label>
                <textarea id="post-content" required rows="4" placeholder="请真实详细地写下你在该店的消费体验，严禁虚假水军造谣..." 
                    class="w-full px-4 py-3 input-field text-sm outline-none resize-none" style="color: var(--text-main);"></textarea>
            </div>

            <div class="flex items-center space-x-3 p-4 rounded-xl" style="background: var(--bg-light);">
                <input type="checkbox" id="post-anonymous" class="anonymous-check w-5 h-5 rounded border-gray-300">
                <label for="post-anonymous" class="text-base font-bold" style="color: var(--text-sub);">
                    我要匿名发布（勾选后将隐藏你的姓名学号，显示为"某不愿透露姓名的校友"）
                </label>
            </div>

            <button type="submit" class="w-full py-3.5 primary-btn text-white text-base font-medium rounded-xl shadow-md">
                发布帖子
            </button>
            <p class="text-xs text-center" style="color: var(--text-sub);">数据将同步至新加坡云端</p>
        </form>
    </div>

    <script src="./api.js"></script>
    <script>
        // 红黑榜选择
        function selectType(type) {
            document.getElementById('post-type').value = type;
            const redBtn = document.getElementById('btn-red');
            const blackBtn = document.getElementById('btn-black');
            
            if (type === 'RED') {
                redBtn.classList.add('selected-red');
                redBtn.classList.remove('selected-black');
                blackBtn.classList.remove('selected-red', 'selected-black');
            } else {
                blackBtn.classList.add('selected-black');
                blackBtn.classList.remove('selected-red');
                redBtn.classList.remove('selected-red', 'selected-black');
            }
        }

        // 星级评分
        const ratingLabels = {
            1: '1星 恶劣至极',
            2: '2星 体验较差',
            3: '3星 水平一般',
            4: '4星 值得一试',
            5: '5星 极力安利'
        };
        let currentRating = 5;

        function setRating(rating) {
            currentRating = rating;
            document.getElementById('post-rating').value = rating;
            updateStars(rating);
            document.getElementById('rating-text').textContent = ratingLabels[rating];
        }

        function hoverStar(rating) {
            updateStars(rating);
            document.getElementById('rating-text').textContent = ratingLabels[rating];
        }

        function resetStarHover() {
            updateStars(currentRating);
            document.getElementById('rating-text').textContent = ratingLabels[currentRating];
        }

        function updateStars(rating) {
            const stars = document.getElementById('star-container').querySelectorAll('button');
            stars.forEach((star, index) => {
                if (index < rating) {
                    star.classList.add('star-filled');
                    star.classList.remove('star-empty');
                } else {
                    star.classList.add('star-empty');
                    star.classList.remove('star-filled');
                }
            });
        }

        // 初始化
        updateStars(5);

        async function handlePostSubmit(e) {
            e.preventDefault();
            const tagsInput = document.getElementById('post-tags').value.trim();
            const postData = {
                shop_name: document.getElementById('post-shop').value.trim(),
                type: document.getElementById('post-type').value,
                rating: parseInt(document.getElementById('post-rating').value),
                title: document.getElementById('post-title').value.trim(),
                content: document.getElementById('post-content').value.trim(),
                tags: tagsInput ? tagsInput.split('、').map(t => t.trim()) : [],
                is_anonymous: document.getElementById('post-anonymous').checked
            };

            try {
                // 强力调用 api.js 封装的安全发帖 SDK
                await createPost(postData);
                alert('🎉 恭喜！发帖流水成功打通 RLS 权限判定，成功入库！');
                window.location.href = 'index.html';
            } catch (err) {
                alert('发帖失败：' + err.message);
            }
        }
    </script>
</body>
</html>
