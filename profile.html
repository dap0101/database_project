<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人中心 - 校园红黑榜</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script>
        const SUPABASE_URL = "https://xxnavrsgjevkcglhecwa.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_y_ECB7HzTdezrPhxDaS5Zw_cKSgAFbF";
        window.supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    </script>
    <script src="./guard.js"></script>
    <style>
        .red-gradient { background: linear-gradient(135deg, #dc2626 0%, #991b1b 100%); }
        .red-badge { background-color: #fee2e2; color: #991b1b; }
        .black-badge { background-color: #f3f4f6; color: #1f2937; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <!-- 顶部导航 -->
    <header class="bg-white shadow-sm sticky top-0 z-50 px-6 py-4">
        <div class="max-w-4xl mx-auto flex items-center justify-between">
            <div class="flex items-center space-x-4">
                <a href="index.html" class="text-gray-600 hover:text-gray-900">← 返回首页</a>
                <h1 class="text-xl font-bold text-gray-900">👤 个人中心</h1>
            </div>
            <button onclick="logoutFlow()" class="px-4 py-2 bg-gray-100 text-gray-700 text-sm font-medium rounded-lg hover:bg-gray-200">退出登录</button>
        </div>
    </header>

    <main class="max-w-4xl mx-auto p-6 space-y-6">
        <!-- 用户信息卡片 -->
        <div class="bg-white p-6 rounded-2xl shadow-md">
            <div class="flex items-center space-x-4">
                <div class="w-16 h-16 bg-gradient-to-br from-red-500 to-red-700 rounded-full flex items-center justify-center text-white text-2xl font-bold" id="user-avatar">
                    👤
                </div>
                <div>
                    <h2 class="text-xl font-bold text-gray-900" id="user-name">加载中...</h2>
                    <p class="text-sm text-gray-500" id="user-email">加载中...</p>
                    <div class="flex items-center space-x-2 mt-2">
                        <span class="px-2 py-1 bg-green-100 text-green-700 text-xs rounded-full">✓ 已认证</span>
                        <span class="text-xs text-gray-400" id="post-count">帖子: 0</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- 我的帖子列表 -->
        <div class="bg-white p-6 rounded-2xl shadow-md">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-bold text-gray-900">📋 我发布的帖子</h3>
                <a href="post.html" class="px-4 py-2 red-gradient text-white text-sm font-medium rounded-lg">+ 发布新帖</a>
            </div>
            <div id="my-posts-container" class="space-y-4">
                <p class="text-gray-400 text-center py-8">加载中...</p>
            </div>
        </div>
    </main>

    <script src="./api.js"></script>
    <script src="./auth.js"></script>
    <script>
        // 加载用户信息和帖子
        async function loadUserProfile() {
            try {
                // 获取当前用户信息
                const { data: { user } } = await window.supabaseClient.auth.getUser();
                if (!user) {
                    window.location.href = 'login.html';
                    return;
                }

                // 获取用户详细信息
                const { data: userInfo, error: userError } = await window.supabaseClient
                    .from('users')
                    .select('student_name, student_id')
                    .eq('id', user.id)
                    .single();

                if (userError) {
                    console.warn('获取用户信息失败:', userError);
                }

                // 更新用户信息显示
                const displayName = userInfo?.student_name || user.email?.split('@')[0] || '未知用户';
                document.getElementById('user-name').textContent = displayName;
                document.getElementById('user-email').textContent = user.email || '无邮箱';
                document.getElementById('user-avatar').textContent = displayName.charAt(0).toUpperCase();

                // 加载用户的帖子
                await loadUserPosts();

            } catch (error) {
                console.error('加载用户信息失败:', error);
                alert('加载用户信息失败，请刷新页面重试');
            }
        }

        // 加载用户帖子列表
        async function loadUserPosts() {
            const container = document.getElementById('my-posts-container');
            try {
                const result = await fetchUserPosts({ limit: 50 });
                const posts = result.data;

                // 更新帖子数量
                document.getElementById('post-count').textContent = `帖子: ${result.pagination.total}`;

                if (posts.length === 0) {
                    container.innerHTML = `
                        <div class="text-center py-8 text-gray-400">
                            <p>你还没有发布过帖子</p>
                            <a href="post.html" class="inline-block mt-2 text-red-600 hover:underline">去发布第一篇 →</a>
                        </div>`;
                    return;
                }

                container.innerHTML = posts.map(post => {
                    const badge = post.type === 'RED' ? 'red-badge' : 'black-badge';
                    const badgeText = post.type === 'RED' ? '🔴 红榜' : '⚫️ 黑榜';
                    return `
                        <div class="p-4 border border-gray-100 rounded-xl bg-gray-50 hover:shadow-md transition-shadow">
                            <div class="flex justify-between items-start mb-2">
                                <div class="flex items-center space-x-2">
                                    <span class="text-xs font-bold px-2 py-1 rounded ${badge}">${badgeText}</span>
                                    <span class="text-xs text-gray-500">${post.rating} 星</span>
                                </div>
                                <div class="flex items-center space-x-2">
                                    <span class="text-xs text-gray-400">${new Date(post.created_at).toLocaleDateString()}</span>
                                    <button onclick="handleDeletePost(${post.id})" class="text-xs text-red-500 hover:text-red-700 px-2 py-1 rounded hover:bg-red-50">删除</button>
                                </div>
                            </div>
                            <h4 class="font-bold text-gray-900 mb-1">${post.title}</h4>
                            <p class="text-sm text-gray-600 line-clamp-2">${post.content}</p>
                            <div class="mt-2 text-xs text-gray-400">
                                店铺: ${post.shop_name} | 标签: ${(post.tags || []).join(', ') || '无'}
                            </div>
                        </div>`;
                }).join('');

            } catch (error) {
                console.error('加载帖子失败:', error);
                container.innerHTML = `<p class="text-red-400 text-center py-4">加载帖子失败: ${error.message}</p>`;
            }
        }

        // 删除帖子处理函数
        async function handleDeletePost(postId) {
            if (!confirm('确定要删除这条帖子吗？此操作不可恢复。')) {
                return;
            }

            try {
                await deletePost(postId);
                alert('帖子删除成功！');
                // 重新加载帖子列表
                await loadUserPosts();
            } catch (error) {
                console.error('删除帖子失败:', error);
                alert('删除失败: ' + error.message);
            }
        }

        // 退出登录
        async function logoutFlow() {
            if(confirm('确认退出登录？')) {
                await signOut();
                window.location.href = 'login.html';
            }
        }

        // 页面加载时初始化
        document.addEventListener('DOMContentLoaded', loadUserProfile);
    </script>
</body>
</html>
