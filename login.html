<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>校园红黑榜 - 实名认证中心</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script>
        const SUPABASE_URL = "https://xxnavrsgjevkcglhecwa.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_y_ECB7HzTdezrPhxDaS5Zw_cKSgAFbF";
        window.supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    </script>
    <style>
        :root {
            --primary: #4A90E2;
            --primary-dark: #357ABD;
            --accent: #FF9F43;
            --bg-light: #F5F7FA;
            --text-main: #2D3748;
            --text-sub: #8A919F;
            --white: #FFFFFF;
            --border-light: #E2E8F0;
        }

        body {
            background: var(--bg-light);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        .login-card {
            background: var(--white);
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.08);
            max-width: 400px;
            width: 100%;
        }

        .input-field {
            border: 1px solid var(--border-light);
            border-radius: 12px;
            padding: 12px 16px;
            font-size: 14px;
            color: var(--text-main);
            background: var(--white);
            transition: all 0.2s ease;
            outline: none;
            width: 100%;
        }
        .input-field:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(74, 144, 226, 0.1);
        }
        .input-field::placeholder {
            color: var(--text-sub);
        }

        .primary-btn {
            background: var(--primary);
            color: white;
            border-radius: 12px;
            padding: 12px;
            font-size: 14px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
        }
        .primary-btn:hover {
            background: var(--primary-dark);
        }

        .tab-btn {
            flex: 1;
            padding: 12px 0;
            font-size: 14px;
            font-weight: 500;
            background: none;
            border: none;
            border-bottom: 2px solid transparent;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--text-sub);
        }
        .tab-btn.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
            font-weight: 600;
        }
        .tab-btn:hover {
            color: var(--text-main);
        }

        .link-text {
            color: var(--text-sub);
            font-size: 13px;
            text-decoration: none;
            transition: color 0.2s ease;
        }
        .link-text:hover {
            color: var(--primary);
        }

        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-main);
            margin-bottom: 6px;
        }

        .required-mark {
            color: var(--primary);
        }
    </style>
<base target="_blank">
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <div class="login-card p-8">
        <!-- 标题区 -->
        <div class="text-center mb-8">
            <h1 class="text-xl font-semibold" style="color: var(--text-main);">用户登录</h1>
            <p class="text-sm mt-1" style="color: var(--text-sub);">请输入账号密码登录</p>
        </div>

        <!-- Tab 切换 -->
        <div class="flex mb-6">
            <button id="tab-login" onclick="switchTab('login')" class="tab-btn active">账号登录</button>
            <button id="tab-register" onclick="switchTab('register')" class="tab-btn">实名注册</button>
        </div>

        <!-- 登录表单 -->
        <form id="form-login" onsubmit="handleLogin(event)" class="space-y-4">
            <div>
                <label class="form-label">校内邮箱</label>
                <input type="email" id="login-email" required 
                    class="input-field" 
                    placeholder="your@email.com">
            </div>
            <div>
                <label class="form-label">密码</label>
                <input type="password" id="login-password" required 
                    class="input-field" 
                    placeholder="请输入密码">
            </div>
            <button type="submit" class="primary-btn mt-2">安全登录</button>
        </form>

        <!-- 注册表单 -->
        <form id="form-register" onsubmit="handleRegister(event)" class="space-y-3 hidden max-h-[400px] overflow-y-auto pr-1">
            <div>
                <label class="form-label">邮箱 <span class="required-mark">*</span></label>
                <input type="email" id="reg-email" required class="input-field">
            </div>
            <div>
                <label class="form-label">密码 <span class="required-mark">*</span> (至少6位)</label>
                <input type="password" id="reg-password" required minlength="6" class="input-field">
            </div>
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="form-label">姓名 <span class="required-mark">*</span></label>
                    <input type="text" id="reg-student-name" required class="input-field">
                </div>
                <div>
                    <label class="form-label">学号 <span class="required-mark">*</span></label>
                    <input type="text" id="reg-student-id" required class="input-field">
                </div>
            </div>
            <div>
                <label class="form-label">大学全称 <span class="required-mark">*</span></label>
                <input type="text" id="reg-school-name" required placeholder="如：南方科技大学" class="input-field">
            </div>
            <div>
                <label class="form-label">联系手机/备用邮箱</label>
                <input type="text" id="reg-phone" class="input-field">
            </div>
            <button type="submit" class="primary-btn mt-2">提交实名注册</button>
        </form>
    </div>

    <script src="./auth.js"></script>
    <script>
        function switchTab(tab) {
            document.getElementById('tab-login').className = tab === 'login' ? 'tab-btn active' : 'tab-btn';
            document.getElementById('tab-register').className = tab === 'register' ? 'tab-btn active' : 'tab-btn';
            document.getElementById('form-login').classList.toggle('hidden', tab !== 'login');
            document.getElementById('form-register').classList.toggle('hidden', tab !== 'register');
        }

        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            try {
                await signInWithEmail(email, password);
                window.location.href = 'index.html';
            } catch (error) {
                alert('登录失败：' + error.message);
            }
        }

        async function handleRegister(e) {
            e.preventDefault();
            const authData = { email: document.getElementById('reg-email').value, password: document.getElementById('reg-password').value };
            const realNameData = {
                school_name: document.getElementById('reg-school-name').value,
                student_name: document.getElementById('reg-student-name').value,
                student_id: document.getElementById('reg-student-id').value,
                phone_or_email: document.getElementById('reg-phone').value
            };
            try {
                await signUpWithRealName(authData, realNameData);
                alert('注册成功！系统已自动绑定实名。现在可以去登录了。');
                switchTab('login');
            } catch (error) {
                alert('注册失败：' + error.message);
            }
        }
    </script>
</body>
</html>
