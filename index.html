    <style>
        :root {
            --primary: #4A90E2;
            --primary-dark: #3A7BC8;
            --accent: #FF9F43;
            --bg-light: #F5F7FA;
            --text-main: #2D3748;
            --text-sub: #8A919F;
            --white: #FFFFFF;
            --red-soft: #F56565;
            --deep-blue: #1E3A5F;
        }
        
        .primary-btn { 
            background: var(--primary); 
            transition: all 0.2s ease;
        }
        .primary-btn:hover { 
            background: var(--primary-dark); 
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(74, 144, 226, 0.3);
        }
        
        .search-card {
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
            border-radius: 16px;
        }
        
        .shop-item {
            transition: all 0.25s ease;
            border-radius: 10px;
        }
        .shop-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.08);
            background: #FAFBFC;
        }
        
        .star-filled { color: var(--accent); }
        .star-empty { color: #E2E8F0; }
        
        .rank-badge {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 700;
        }
        .rank-1 { background: #FFF5E6; color: var(--accent); }
        .rank-2 { background: #F0F4F8; color: var(--text-sub); }
        .rank-3 { background: #FFF0F0; color: var(--red-soft); }
        
        .red-gradient { 
            background: linear-gradient(135deg, #dc2626 0%, #991b1b 100%); 
        }
        .red-badge { 
            background-color: #FFF0F0; 
            color: #C53030; 
        }
        .black-badge { 
            background-color: #2D3748; 
            color: #F7FAFC; 
        }
        
        .card-hover { 
            transition: all 0.2s ease; 
        }
        .card-hover:hover { 
            transform: translateY(-2px); 
            box-shadow: 0 8px 25px -5px rgba(0,0,0,0.1); 
        }
        
        .star-bar { 
            transition: width 0.6s ease-out; 
        }

        /* 词云标签样式 */
        .tag-cloud-item {
            transition: all 0.2s ease;
            cursor: default;
        }
        .tag-cloud-item:hover {
            transform: scale(1.05);
        }
        .tag-red {
            background: #FFF0F0;
            color: #C53030;
            border: 1px solid #FED7D7;
        }
        .tag-black {
            background: #F7FAFC;
            color: #2D3748;
            border: 1px solid #E2E8F0;
        }

        /* 数字滚动动画 */
        .stat-number {
            font-weight: 800;
            color: var(--deep-blue);
            font-variant-numeric: tabular-nums;
            display: inline-block;
            min-width: 1.5em;
            text-align: center;
        }
        
        .stat-card {
            background: linear-gradient(135deg, #ffffff 0%, #f8fafc 100%);
            border: 1px solid #e2e8f0;
            transition: all 0.3s ease;
        }
        .stat-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(30, 58, 95, 0.08);
        }
        
        @keyframes countUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .stat-item {
            animation: countUp 0.6s ease-out forwards;
        }
        .stat-item:nth-child(1) { animation-delay: 0s; }
        .stat-item:nth-child(2) { animation-delay: 0.15s; }
        .stat-item:nth-child(3) { animation-delay: 0.3s; }
    </style>

            <div class="flex items-center justify-center space-x-8">

                校内店铺口碑 TOP 10
            </h3>
            <div id="top-shops-list" class="space-y-3">

    <script src="./api.js"></script>

    <script>
        async function logoutFlow() {
            if(confirm('确认退出登录？')) {
                await signOut();
                window.location.href = 'login.html';
            }
        }

        // 数字滚动动画
        function animateNumber(elementId, targetValue, duration = 1500) {
            const element = document.getElementById(elementId);
            const startTime = performance.now();
            const startValue = 0;
            
            function update(currentTime) {
                const elapsed = currentTime - startTime;
                const progress = Math.min(elapsed / duration, 1);
                
                // 使用 easeOutExpo 缓动函数，让滚动效果更自然
                const easeProgress = 1 - Math.pow(2, -10 * progress);
                const currentValue = Math.floor(startValue + (targetValue - startValue) * easeProgress);
                
                element.textContent = currentValue;
                
                if (progress < 1) {
                    requestAnimationFrame(update);
                } else {
                    element.textContent = targetValue;
                }
            }
            
            requestAnimationFrame(update);
        }

        // 加载全局统计数据
        async function loadGlobalStats() {
            const card = document.getElementById('stats-overview-card');
            try {
                // 获取总用户数
                const { data: userData, error: userError } = await window.supabaseClient
                    .from('posts')
                    .select('user_id')
                    .eq('is_deleted', false);
                
                // 获取总帖子数
                const { count: postCount, error: postError } = await window.supabaseClient
                    .from('posts')
                    .select('*', { count: 'exact', head: true })
                    .eq('is_deleted', false);
                
                // 获取唯一店铺数（从 posts 表统计）
                const { data: shopData, error: shopError } = await window.supabaseClient
                    .from('posts')
                    .select('shop_name')
                    .eq('is_deleted', false);
                
		  const uniqueUsers = userData ? new Set(userData.map(p => p.user_id)).size : 0;
                const uniqueShops = shopData ? new Set(shopData.map(p => p.shop_name)).size : 0;

                if (userError || postError || shopError) throw new Error('统计数据加载失败');

                card.classList.remove('hidden');
                
                // 触发数字滚动动画
                animateNumber('stat-users', uniqueUsers || 0, 1200);
                animateNumber('stat-shops', uniqueShops, 1400);
                animateNumber('stat-reviews', postCount || 0, 1600);

            } catch (error) {
                console.error('加载统计数据失败:', error);
                card.classList.add('hidden');
            }
        }

        // 加载排行榜
        async function loadTopShops() {
            const container = document.getElementById('top-shops-list');
            try {
                const result = await fetchTopShops(10);
                
                if (result.data.length === 0) {
                    container.innerHTML = '<p class="text-sm text-center py-4" style="color: var(--text-sub);">暂无数据</p>';
                    return;
                }

                container.innerHTML = result.data.map((shop, index) => {
                    const rankClass = index === 0 ? 'rank-1' : index === 1 ? 'rank-2' : index === 2 ? 'rank-3' : '';
                    const rankIcon = index < 3 ? '' : `<span style="color: var(--text-sub); font-size: 13px;">${index + 1}</span>`;
                    const medal = index === 0 ? '🥇' : index === 1 ? '🥈' : index === 2 ? '🥉' : '';
                    
                    const fullStars = Math.floor(shop.avg_rating);
                    let starsHtml = '';
                    for (let i = 0; i < 5; i++) {
                        if (i < fullStars) {
                            starsHtml += '<span class="star-filled">★</span>';
                        } else {
                            starsHtml += '<span class="star-empty">★</span>';
                        }
                    }
                    
                    return `
                        <div class="shop-item flex items-center justify-between p-4 bg-gray-50 cursor-pointer" 
                             onclick="document.getElementById('shop-search').value='${shop.shop_name}';triggerSearch();">
                            <div class="flex items-center space-x-4">
                                <div class="rank-badge ${rankClass}">${medal}${rankIcon}</div>
                                <span class="font-medium text-base" style="color: var(--text-main);">${shop.shop_name}</span>
                            </div>
                            <div class="flex items-center space-x-4">
                                <div class="text-sm">${starsHtml}</div>
                                <div class="text-right">
                                    <span class="font-bold text-lg" style="color: var(--primary);">${shop.avg_rating.toFixed(1)}</span>
                                    <span class="text-xs ml-1" style="color: var(--text-sub);">分</span>
                                    <span class="text-xs ml-2" style="color: var(--text-sub);">${shop.total_reviews} 评</span>
                                </div>
                            </div>
                        </div>`;
                }).join('');
                
            } catch (error) {
                console.error('加载排行榜失败:', error);
                container.innerHTML = '<p class="text-sm text-center py-4" style="color: var(--text-sub);">加载失败</p>';
            }
        }

        // 加载标签词云
        async function loadTagsCloud(shopName) {
            const card = document.getElementById('tags-cloud-card');
            const redContainer = document.getElementById('red-tags-cloud');
            const blackContainer = document.getElementById('black-tags-cloud');
            
            try {
                const result = await fetchShopTags(shopName);
                
                if (result.red_tags.length > 0) {
                    redContainer.innerHTML = result.red_tags.map(item => {
                        const sizeClass = item.count >= 3 ? 'text-sm px-3 py-1.5' : item.count === 2 ? 'text-xs px-2.5 py-1' : 'text-xs px-2 py-0.5';
                        return `<span class="tag-cloud-item tag-red rounded-full font-medium ${sizeClass}">${item.tag} · ${item.count}</span>`;
                    }).join('');
                } else {
                    redContainer.innerHTML = '<span class="text-xs" style="color: var(--text-sub);">暂无红榜标签</span>';
                }
                
                if (result.black_tags.length > 0) {
                    blackContainer.innerHTML = result.black_tags.map(item => {
                        const sizeClass = item.count >= 3 ? 'text-sm px-3 py-1.5' : item.count === 2 ? 'text-xs px-2.5 py-1' : 'text-xs px-2 py-0.5';
                        return `<span class="tag-cloud-item tag-black rounded-full font-medium ${sizeClass}">${item.tag} · ${item.count}</span>`;
                    }).join('');
                } else {
                    blackContainer.innerHTML = '<span class="text-xs" style="color: var(--text-sub);">暂无黑榜标签</span>';
                }
                
                card.classList.remove('hidden');
                
            } catch (error) {
                console.error('加载标签词云失败:', error);
                card.classList.add('hidden');
            }
        }

        // 页面加载时自动获取
        loadGlobalStats();
        loadTopShops();

        async function triggerSearch() {
            const keyword = document.getElementById('shop-search').value.trim();
            if(!keyword) return alert('请输入店铺名字！');

            try {
                const stats = await fetchShopStats(keyword);
                document.getElementById('display-shop-name').textContent = stats.shop_name;
                document.getElementById('display-avg').textContent = stats.avg_rating.toFixed(1);
                document.getElementById('display-total').textContent = stats.total_reviews;

                const barsContainer = document.getElementById('histogram-bars');
                barsContainer.innerHTML = '';
                
                const stars = ['five_star', 'four_star', 'three_star', 'two_star', 'one_star'];
                const starLabels = ['5 星', '4 星', '3 星', '2 星', '1 星'];
                const barColors = ['bg-red-500', 'bg-red-700', 'bg-purple-800', 'bg-gray-700', 'bg-gray-900'];
                
                stars.forEach((key, idx) => {
                    const count = stats.histogram[key];
                    const percent = stats.total_reviews > 0 ? (count / stats.total_reviews) * 100 : 0;
                    barsContainer.innerHTML += `
                        <div class="flex items-center space-x-4">
                            <span class="w-12 text-sm font-medium text-right" style="color: var(--text-sub);">${starLabels[idx]}</span>
                            <div class="flex-1 bg-gray-100 h-4 rounded-full overflow-hidden">
                                <div class="${barColors[idx]} h-full rounded-full star-bar" style="width: 0%" data-width="${percent}%"></div>
                            </div>
                            <span class="w-10 text-sm font-medium text-right" style="color: var(--text-sub);">${count} 帖</span>
                        </div>`;
                });
                
                setTimeout(() => {
                    document.querySelectorAll('.star-bar').forEach(bar => {
                        bar.style.width = bar.getAttribute('data-width');
                    });
                }, 100);
                
                document.getElementById('stats-card').classList.remove('hidden');
                await loadTagsCloud(keyword);

                const postsResult = await fetchShopPosts(keyword);
                const container = document.getElementById('posts-container');
                container.innerHTML = '';

                if(postsResult.data.length === 0) {
                    container.innerHTML = '<div class="col-span-2 text-center py-12" style="color: var(--text-sub);"><p class="text-lg mb-2">📝</p><p>该店暂无评价，快去抢首发！</p></div>';
                } else {
                    const redPosts = postsResult.data.filter(post => post.type === 'RED');
                    const blackPosts = postsResult.data.filter(post => post.type === 'BLACK');
                    
                    const redSection = document.createElement('div');
                    redSection.innerHTML = `
                        <div class="flex items-center mb-3">
                            <div class="w-8 h-8 rounded-full flex items-center justify-center mr-3" style="background: #FFF0F0;">
                                <span style="color: #C53030; font-size: 14px;">🔴</span>
                            </div>
                            <h4 class="text-lg font-semibold" style="color: #C53030;">红榜推荐</h4>
                            <span class="ml-2 px-2 py-0.5 rounded-full text-xs font-medium" style="background: #FFF0F0; color: #C53030;">${redPosts.length} 条</span>
                        </div>
                        <div class="space-y-3">
                            ${redPosts.length > 0 
                                ? redPosts.map(post => renderPostCard(post)).join('')
                                : '<div class="text-center py-8" style="color: var(--text-sub);"><p class="text-sm">暂无红榜推荐</p><p class="text-xs mt-1">这家店还没有好评，你要做第一个吗？</p></div>'
                            }
                        </div>`;
                    
                    const blackSection = document.createElement('div');
                    blackSection.innerHTML = `
                        <div class="flex items-center mb-3">
                            <div class="w-8 h-8 rounded-full flex items-center justify-center mr-3" style="background: #2D3748;">
                                <span style="color: #F7FAFC; font-size: 14px;">⚫</span>
                            </div>
                            <h4 class="text-lg font-semibold" style="color: #2D3748;">黑榜避雷</h4>
                            <span class="ml-2 px-2 py-0.5 rounded-full text-xs font-medium" style="background: #F0F4F8; color: var(--text-sub);">${blackPosts.length} 条</span>
                        </div>
                        <div class="space-y-3">
                            ${blackPosts.length > 0 
                                ? blackPosts.map(post => renderPostCard(post)).join('')
                                : '<div class="text-center py-8" style="color: var(--text-sub);"><p class="text-sm">暂无黑榜避雷</p><p class="text-xs mt-1">这家店口碑不错，暂时没人吐槽</p></div>'
                            }
                        </div>`;
                    
                    container.appendChild(redSection);
                    container.appendChild(blackSection);
                }
                document.getElementById('posts-card').classList.remove('hidden');

            } catch(err) {
                alert('数据加载异常: ' + err.message);
            }
        }
        
        function renderPostCard(post) {
            const badge = post.type === 'RED' ? 'red-badge' : 'black-badge';
            const badgeText = post.type === 'RED' ? '红榜种草' : '黑榜避坑';
            const badgeIcon = post.type === 'RED' ? '🔴' : '⚫️';
            
            const fullStars = post.rating;
            let starsHtml = '';
            for (let i = 0; i < 5; i++) {
                if (i < fullStars) {
                    starsHtml += '<span style="color: var(--accent);">★</span>';
                } else {
                    starsHtml += '<span style="color: #E2E8F0;">★</span>';
                }
            }
            
            return `
                <div class="p-5 bg-white border border-gray-100 rounded-xl card-hover cursor-pointer">
                    <div class="flex justify-between items-start mb-3">
                        <div class="flex items-center space-x-2">
                            <span class="text-xs font-bold px-2.5 py-1 rounded-md ${badge}">${badgeIcon} ${badgeText}</span>
                            <span class="text-xs font-medium" style="color: var(--accent);">${starsHtml}</span>
                        </div>
                        <span class="text-xs" style="color: var(--text-sub);">${new Date(post.created_at).toLocaleDateString()}</span>
                    </div>
                    <h4 class="font-semibold mb-2 text-base" style="color: var(--text-main);">${post.title}</h4>
                    <p class="text-sm leading-relaxed mb-4" style="color: var(--text-sub);">${post.content}</p>
                    <div class="flex justify-between items-center">
                        <div class="flex flex-wrap gap-1.5">
                          ${post.tags.length > 0 
                            ? post.tags.map(tag => `<span class="px-2.5 py-0.5 rounded-full border text-[10px] font-medium" style="background: var(--bg-light); color: var(--primary); border-color: #E2E8F0;">${tag}</span>`).join('')
                            : ''
                          }
                        </div>
                        <span class="text-xs font-medium" style="color: var(--text-sub);">🙋‍♂️ ${post.author_name}</span>
                    </div>
                </div>`;
        }


    // ========== 问候语模块（追加，不影响已有代码）==========
    (function initGreeting() {
        const hour = new Date().getHours();
        let greeting = '晚上好';
        if (hour >= 5 && hour < 12) greeting = '上午好';
        else if (hour >= 12 && hour < 18) greeting = '下午好';

        async function showGreeting() {
            try {
                const { data: { user } } = await window.supabaseClient.auth.getUser();
                let userName = '同学';

                if (user) {
                    const { data: userInfo } = await window.supabaseClient
                        .from('users')
                        .select('student_name')
                        .eq('id', user.id)
                        .single();

                    userName = userInfo?.student_name || user.email?.split('@')[0] || '同学';
                }

                const greetingEl = document.createElement('span');
                greetingEl.id = 'user-greeting';
                greetingEl.innerHTML = greeting + '，<span style="color:#4A90E2;font-weight:700;">' + userName + '</span>';
                greetingEl.style.cssText = 'font-size:15px;color:#2D3748;font-weight:600;margin-right:12px;';

                const nav = document.querySelector('header .flex.items-center.space-x-3');
                if (nav) {
                    const profileLink = nav.querySelector('a[href="profile.html"]');
                    if (profileLink) {
                        nav.insertBefore(greetingEl, profileLink);
                    }
                }
            } catch (err) {
                console.log('问候语加载失败:', err);
            }
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', showGreeting);
        } else {
            showGreeting();
        }
    })();
    </script>
